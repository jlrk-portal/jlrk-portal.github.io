<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLRK 정산 포털 · 주소 변경 안내</title>
<style>
  :root{
    --ink:#0d0f10; --ink2:#16191b;
    --line:rgba(255,255,255,.12);
    --fg:#f4f5f5; --muted:#a7afb3;
    --accent:#1983C0; --accent2:#41BDED;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--fg);
    font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(1200px 700px at 72% -10%, rgba(25,131,192,.22), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(65,189,237,.12), transparent 55%),
      linear-gradient(180deg,#0d0f10 0%,#121619 100%);
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:32px;
  }
  .card{
    width:100%; max-width:560px;
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border:1px solid var(--line);
    border-radius:20px;
    padding:48px 44px 40px;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    backdrop-filter:blur(6px);
    text-align:center;
  }
  .brand{
    display:inline-flex; align-items:center; gap:10px;
    font-weight:800; letter-spacing:.18em; font-size:13px;
    color:var(--fg);
    padding:7px 14px; border:1px solid var(--line); border-radius:999px;
    margin-bottom:30px;
  }
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 12px var(--accent2)}
  .eyebrow{
    font-size:12px; letter-spacing:.22em; color:var(--accent2);
    font-weight:700; margin:0 0 14px; text-transform:uppercase;
  }
  h1{
    font-size:27px; line-height:1.35; margin:0 0 16px;
    font-weight:800; letter-spacing:-.01em; text-wrap:balance;
  }
  h1 .hl{color:var(--accent2)}
  p.lead{
    font-size:15px; line-height:1.75; color:var(--muted);
    margin:0 auto 30px; max-width:420px;
  }
  .cta{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    width:100%; max-width:360px;
    padding:16px 22px; border-radius:12px;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    color:#fff; font-size:16px; font-weight:800; letter-spacing:.01em;
    text-decoration:none; border:0; cursor:pointer;
    box-shadow:0 12px 30px rgba(25,131,192,.4);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cta:hover{transform:translateY(-1px); box-shadow:0 16px 38px rgba(25,131,192,.52)}
  .cta svg{width:18px;height:18px}
  .url{
    margin-top:16px; font-size:13px; color:var(--muted);
    letter-spacing:.02em;
  }
  .url b{color:var(--fg); font-weight:700}
  .divider{height:1px; background:var(--line); margin:30px 0 22px}
  .note{
    display:flex; gap:12px; text-align:left;
    font-size:13.5px; line-height:1.65; color:var(--muted);
    max-width:420px; margin:0 auto;
  }
  .note + .note{margin-top:14px}
  .note .ico{
    flex:0 0 auto; width:22px;height:22px; margin-top:1px;
    display:grid; place-items:center;
    border:1px solid var(--line); border-radius:7px; color:var(--accent2);
  }
  .note .ico svg{width:13px;height:13px}
  .note b{color:var(--fg); font-weight:700}
  .foot{
    margin-top:30px; font-size:11.5px; letter-spacing:.14em;
    color:#6a7175; text-transform:uppercase;
  }
  .count{color:var(--accent2); font-weight:800}
  @media (max-width:560px){
    .card{padding:38px 24px 32px; border-radius:16px}
    h1{font-size:22px}
  }
</style>
</head>
<body>
  <main class="card">
    <span class="brand"><span class="dot"></span>JLRK · 정산 포털</span>

    <p class="eyebrow">주소 변경 안내</p>
    <h1>정산 포털이<br><span class="hl">새 주소</span>로 이동했습니다</h1>
    <p class="lead">
      더 빠르고 안정적인 환경으로 포털을 이전했습니다.<br>
      아래 버튼을 눌러 이동하신 뒤, <b style="color:#cfd6d9">기존 계정</b>으로 그대로 로그인해 주세요.
    </p>

    <a class="cta" id="goBtn" href="https://jlrk-portal.vercel.app/login.html">
      새 포털로 이동
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <div class="url">새 주소 · <b>jlrk-portal.vercel.app</b></div>

    <div class="divider"></div>

    <div class="note">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12a4 4 0 1 0-8 0M12 2v2M12 16v6M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4"/><circle cx="12" cy="12" r="3"/></svg></span>
      <div><b>로그인 정보는 그대로입니다.</b> 기존에 쓰시던 이메일·비밀번호를 새 주소에서 동일하게 사용하시면 됩니다.</div>
    </div>
    <div class="note">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
      <div><b>즐겨찾기를 새 주소로 변경</b>해 주세요. 기존 주소로 접속하셔도 자동으로 새 포털로 연결됩니다.</div>
    </div>

    <p class="foot"><span class="count" id="cd">10</span>초 후 자동으로 이동합니다</p>
  </main>

  <script>
    (function(){
      var DEST = "https://jlrk-portal.vercel.app/login.html";
      var el = document.getElementById('cd');
      var n = 10, cancelled = false;
      // 사용자가 페이지를 읽으려 스크롤/클릭하면 자동이동 멈춤
      ['wheel','touchstart','keydown'].forEach(function(ev){
        window.addEventListener(ev, function(){ cancelled = true; }, {once:true, passive:true});
      });
      var t = setInterval(function(){
        if(cancelled){ clearInterval(t); el.parentElement.innerHTML='아래 버튼을 눌러 이동해 주세요'; return; }
        n--; if(el) el.textContent = n;
        if(n<=0){ clearInterval(t); location.href = DEST; }
      }, 1000);
    })();
  </script>
</body>
</html>
